<svg width="1012" height="250" viewBox="0 0 1012 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aryan Ranade — AI/ML Engineer, Computer Science Student">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1010" height="248" rx="16"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#57606A" opacity="0.16"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1010" height="248" rx="16" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect width="1012" height="250" fill="url(#dots)"/>
    <circle cx="890" cy="10" r="320" fill="url(#glow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,206 q55,-14 110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 " stroke="#0D9488" stroke-opacity="0.32" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-220 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M0,222 q55,-14 110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 " stroke="#0D9488" stroke-opacity="0.16" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="0 0" dur="24s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="1010" height="248" rx="16" stroke="#D0D7DE" stroke-width="1.5"/>

  <text x="30" y="44" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#57606A"><tspan fill="#0D9488">~</tspan>/aryanranade <tspan fill="#0D9488">$</tspan></text>
  <g transform="translate(756,24)">
    <rect width="230" height="30" rx="15" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="18" cy="15" r="4" fill="#0D9488">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#57606A">OPEN TO AI/ML INTERNSHIPS</text>
  </g>

  <text x="506" y="122" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="0.5" fill="#1F2328">Aryan Ranade</text>
  <rect x="474" y="142" width="64" height="2.5" rx="1.25" fill="#0D9488"/>
  <text x="506" y="176" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="2.5" fill="#57606A">AI/ML ENGINEER<tspan fill="#0D9488" dx="10">·</tspan><tspan dx="10">COMPUTER SCIENCE STUDENT</tspan></text>
</svg>
